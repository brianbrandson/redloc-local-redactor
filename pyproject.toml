[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redloc"
version = "0.1.0"
description = "Local-first paste redactor for operator workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.scripts]
redloc = "redactor.cli:main"
redloc-benchmark = "redactor.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["redactor"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.hermes.md",
    "/.hermes",
    "/AGENTS.md",
    "/BACKLOG.md",
    "/INSTALL.md",
    "/docs",
    "/dist",
    "/spikes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "spikes", "dist"]
skips = ["B404", "B603", "B607"]
